name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm exec turbo typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm exec turbo lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Sviten går på ~1 min; taket täcker install + build av @eken/shared.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # postinstall kör `prisma generate` — sviten kompilerar mot Prisma-klientens
      # typer, så den MÅSTE finnas innan jest startar.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `test:ci` = `jest --ci --runInBand`. SERIELLT är ett medvetet val, inte
      # en genväg: ubuntu-latest har 2 kärnor / ~7 GB, och med parallella workers
      # dödar OS:ets OOM-hanterare jest-workers mitt i körningen
      # ("A jest worker process was terminated ... signal=SIGTERM"). Det ger
      # slumpvis röda sviter UTAN ett enda testfel — precis den sortens flakiga
      # grind som lär folk att trycka om i stället för att läsa felet.
      #
      # Uppmätt på identisk hårdvara (2 kärnor): --maxWorkers=2 → 154 s med 5
      # OOM-dödade sviter; --runInBand → 48 s, 176/176 gröna. Seriellt är alltså
      # både snabbare OCH deterministiskt här — workerstart och ts-jest-
      # kompilering per worker dominerade tiden.
      #
      # turbo-tasken har dependsOn ["^build"] → @eken/shared byggs först.
      - name: Run test suite
        run: pnpm exec turbo test:ci

  index-guard:
    name: Critical index guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rent statisk kontroll (fs-only, inga beroenden, ingen DB) — verifierar att
      # kritiska partiella index som bara lever i migrations-SQL (t.ex.
      # lease_unit_active_unique, som Prisma inte kan deklarera) inte tyst
      # DROP:ats/försvagats av en `prisma migrate dev`-drift. Se #59 / T5 Fas B2.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify critical partial DB indexes survive migrations
        run: node apps/api/scripts/check-critical-indexes.mjs

  invoice-number-guard:
    name: Platform invoice-number source guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rent statisk kontroll (fs-only, inga beroenden, ingen DB) — säkerställer att
      # PlatformInvoice.invoiceNumber ENBART allokeras via den delade, race-säkra
      # allocatePlatformInvoiceNumber() (atomär sekvens i tx). Fångar en framtida
      # kringgång (create/createMany/upsert utan allokerare, update som omnumrerar,
      # rå SQL) innan racet återuppstår. Se T5 FAR-uppföljning.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test the guard (good passes, bypass variants caught)
        run: node apps/api/scripts/check-platform-invoice-number-source.mjs --self-test

      - name: Verify invoice-number is only sourced from the shared sequence
        run: node apps/api/scripts/check-platform-invoice-number-source.mjs

  reminder-fee-guard:
    name: Reminder fee amount guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rent statisk kontroll (fs-only, inga beroenden, ingen DB) — säkerställer att
      # varje skrivare av påminnelseavgiften hämtar beloppet ur resolveReminderFee,
      # som bär BÅDE avtalsgrunden (2 § lagen 1981:739) och det lagstadgade taket
      # (4 §, tvingande enligt 6 § 1 st). Typsystemet skyddar redan BOKFÖRINGS-
      # sidan (bookReminderFee kräver debtOrigin + termsFrom och klampar), men
      # avgiften skrivs på FLER ställen: RentNotice.reminderFeeAmount,
      # PaymentReminder.feeAmount (summeras in i inkassounderlagets avgiftskolumn)
      # och fakturans avgiftsrad skrivs FÖRE bokföringen och passerar inte
      # kompilatorns grind. En skrivare som hoppar över resolvern får reskontran
      # att kräva ett belopp huvudboken inte bär — samma divergens som #357
      # stängde, med omvänt tecken. Guarden krävde tidigare bara predikatet; det
      # kravet var uppfyllt av precis den kod som skrev oklampade belopp.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test the guard (good passes, bypass variants caught)
        run: node apps/api/scripts/check-reminder-fee-source.mjs --self-test

      - name: Verify every reminder-fee writer resolves its amount through the shared rule
        run: node apps/api/scripts/check-reminder-fee-source.mjs

  period-lookup-guard:
    name: Accounting period lookup guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Rent statisk kontroll (fs-only, inga beroenden, ingen DB) — säkerställer att
      # frågan "är bokföringsperioden stängd?" ENBART ställs via den delade
      # accounting/closed-period.ts, och att AccountingPeriodEvent förblir
      # append-only (ingen update/delete/upsert någonstans, inte ens där).
      # En egen kopia kan ställa en annan fråga än spärren i allocate() och bli en
      # TYST TILLÅTARE — verifikat i en stängd period utan att något säger ifrån.
      # Se T5 PR1b.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test the guard (legitimate code passes, bypass variants caught)
        run: node apps/api/scripts/check-period-lookup-source.mjs --self-test

      - name: Verify period state is only looked up via the shared helper
        run: node apps/api/scripts/check-period-lookup-source.mjs

  design-token-guard:
    name: Design token guard
    # NEGATIVKONTROLL (#405) — TILLFÄLLIG, tas bort före merge.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: AVSIKTLIGT BROTT (negativkontroll #405)
        run: |
          echo 'Detta jobb failar med flit — paraplyet MÅSTE falla.'
          exit 1

      - uses: actions/checkout@v4

      # Rent statisk kontroll (fs-only, inga beroenden) — spärr mot att nya rå
      # färgvärden smyger in utanför @eken/ui och blir ytor som färgflippen inte
      # når. Täcker hex, Tailwind-arbitrary (`bg-[#…]`) och rgb()/hsl(), i både
      # CSS/CSS Modules och TS/TSX. Tre lager:
      #   • hårt      — @eken/ui:s låsta målvärden och HELT NYA färger faller
      #                 alltid; varumärkesfärgen ska komma ur en token eller
      #                 DEFAULT_BRAND_COLOR.
      #   • allowlist — flipp-skulden i scripts/design-tokens.baseline.json. Varje
      #                 post pekar på en kategori med why + flip. Ratchet: fler
      #                 träffar fäller, färre snävar åt. Ska nå noll vid flippen.
      #   • inline    — `design-tokens-allow: <varför>` för färger som ALDRIG ska
      #                 tokeniseras (kunddata, falska positiver).
      # Kör även i `pnpm lint`; detta är den blockerande grinden. Se ADR:n (PR7).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self-test the guard (detection, comment stripping, allowlist)
        run: node scripts/check-design-tokens.mjs --self-test

      - name: Verify no new raw colour values outside @eken/ui
        run: node scripts/check-design-tokens.mjs

  generated-knowledge-sync-guard:
    name: Generated legal knowledge sync guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Spärr mot att `knowledge:generate` glöms (#382, PR2). Generatorn körs för
      # hand, och `.claude/` följer INTE med i prod-imagen — det är
      # `src/ai/knowledge/generated/` som faktiskt körs i drift. Committas en
      # verifierad lagtextändring utan att generatorn körts om kör produktionen
      # en äldre lydelse än den en människa granskade, samtidigt som
      # citat-integriteten stämplar den gamla texten med den nya filens
      # `verifieradPer`. Samma felklass som #382 med omvänt tecken: där citerades
      # en upphävd lag som gällande, här når en gällande ändring aldrig fram.
      #
      # Grinden kör den RIKTIGA generatorn och kräver rent arbetsträd — den
      # reimplementerar ingenting, så generatorn förblir enda sanningen om hur en
      # modul ska se ut. Kräver därför pnpm install (generatorn är ts-node),
      # till skillnad från de fs-only-grindar som ligger ovan.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Self-test the guard (a source edit without regeneration must fail it)
        run: node apps/api/scripts/check-generated-knowledge-sync.mjs --self-test

      - name: Verify generated/ matches .claude/knowledge/lagar/
        run: node apps/api/scripts/check-generated-knowledge-sync.mjs

  # ── Paraply: EN check att pinna en required-regel mot (#405) ────────────────
  #
  # VARFÖR: en branch protection-regel pinnas mot ett CHECKNAMN, inte mot ett
  # jobb. Nio namn i en regel är nio strängar som kan glida — jobbnamn i den här
  # filen har redan bytts två gånger (`Build` → `Lint`, och
  # `Reminder fee contractual-basis guard` → `Reminder fee amount guard` i #404),
  # och en regel som pekar på ett namn som inte längre rapporteras blir tyst
  # verkningslös: PR:en blir grön för att checken aldrig dyker upp. Med ett
  # paraply finns EN sträng att pinna, och den strängen ändras inte när ett
  # underliggande jobb byter namn.
  #
  # ⚠ NEEDS-LISTAN ÄR EN UPPRÄKNING — VARJE NY VAKT MÅSTE IN PÅ TVÅ STÄLLEN.
  # Läggs ett jobb till i den här filen men inte i `needs` nedan, kör det
  # fortfarande, men paraplyet väntar inte på det och bryr sig inte om utfallet.
  # Den nya vakten grindar då ingenting, och ingenting säger till. Det är samma
  # felklass som paraplyet finns för att stänga, en nivå upp. Se PR-texten till
  # #405 för varför en uppräkning ändå valdes framför alternativen.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` är BÄRANDE, inte kosmetik. Utan den skippas det här jobbet så
    # snart något i `needs` failar — och GitHub räknar en SKIPPAD required check
    # som GODKÄND. Paraplyet vore då grönt exakt när sviten är röd. Uppmätt i
    # den här PR:en: ett kontrolljobb utan `always()` fick result `skipped` när
    # dess beroende failade, medan det här jobbet fick `failure`.
    if: always()
    needs:
      - typecheck
      - lint
      - test
      - index-guard
      - invoice-number-guard
      - reminder-fee-guard
      - period-lookup-guard
      - design-token-guard
      - generated-knowledge-sync-guard
    steps:
      # `always()` får jobbet att KÖRA, men säger ingenting om utfallet — utan
      # den här kontrollen skulle det köra och lyckas oavsett vad som hänt.
      # Kravet är `success` för VARJE jobb: `failure`, `cancelled` och `skipped`
      # fäller alla. Inget jobb i den här filen har ett `if:`, så inget skippas
      # legitimt; skulle det ändras är ett fall bättre än ett tyst godkännande.
      - name: Verify every CI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" | jq -r 'to_entries | map(select(.value.result != "success")) | .[].key')
          if [ -n "$failed" ]; then
            echo ""
            echo "CI FAILED — dessa jobb gav inte 'success':"
            echo "$failed" | sed 's/^/  • /'
            exit 1
          fi
          echo ""
          echo "Alla $(echo "$NEEDS" | jq 'length') CI-jobb gav success."

  # NEGATIVKONTROLL (#405) — TILLFÄLLIG, tas bort före merge.
  # Mäter premissen som stod som obekräftad i ärendet: ett needs-jobb vars
  # beroende failar blir SKIPPAT, inte failat. Inget `if: always()` här — det är
  # hela poängen. Jämför resultatet med `CI passed`, som har always().
  skipped-probe:
    name: PROBE utan always (ska bli skipped)
    runs-on: ubuntu-latest
    needs: [design-token-guard]
    steps:
      - run: echo "Om du ser det här körde jobbet — då är premissen fel."
